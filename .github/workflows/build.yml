name: build

# 这个仓库不申请代码签名：构建出来的 exe 是未签名的，Release 说明里会明确写出来。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          Write-Host "syntax ok"

      - name: Build Windows installers
        run: npm run dist -- --publish never
        env:
          # 没有证书：显式关掉自动发现，避免 electron-builder 去找证书或试图签名
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem dist -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload installers (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SKN-Driver-installers
          path: dist/*.exe
          if-no-files-found: error

      # Release 的资产名必须是 ASCII：GitHub 服务端会把中文从资产名里全部剥掉
      # （实测 `SKN键盘驱动-安装版-1.0.6.exe` 会变成 `SKN-1.0.6.exe`，安装版和便携版还会撞名）
      - name: Collect release assets and notes
        run: npm run release-assets

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish-release